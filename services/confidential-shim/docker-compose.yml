# Full shim stack for the Confidential VM:
#   ollama - model server, models persisted in a named volume across restarts
#   shim   - this service, port 8080 internal only
#   caddy  - TLS termination on 80/443 with an sslip.io hostname, so the app
#            gets a real https CONFIDENTIAL_AI_BASE_URL with zero DNS setup
#
# Required env (set in a .env file next to this compose file, never committed):
#   SHIM_API_KEY  bearer key; the app sets CONFIDENTIAL_AI_API_KEY to the same value
#   SHIM_DOMAIN   e.g. 34-10-20-30.sslip.io for a VM whose static IP is 34.10.20.30
#
# First run only: pull the model into the ollama volume
#   docker compose exec ollama ollama pull gemma3:4b-it-qat

services:
  ollama:
    # latest on purpose: gemma3 QAT support moves with ollama releases and the
    # models volume pins the actual weights; pin a digest before any real launch.
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  shim:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      SHIM_MODEL: ${SHIM_MODEL:-gemma3:4b-it-qat}
      SHIM_API_KEY: ${SHIM_API_KEY:?set SHIM_API_KEY in .env}
      SHIM_DATA_DIR: /data/jobs
      PORT: 8080
      # Attestation (Tier A). Default software so a non-SEV host still boots;
      # set SHIM_ATTESTATION_MODE=sev-snp in .env on the Confidential VM.
      SHIM_ATTESTATION_MODE: ${SHIM_ATTESTATION_MODE:-software}
      SHIM_SEV_VMPL: ${SHIM_SEV_VMPL:-0}
    # /dev/sev-guest passthrough so snpguest can request a hardware report. The
    # host is an n2d SEV_SNP VM (ops/up.sh); the device is 0600 root:root, so
    # the shim runs as root. Harmless on a non-SEV host only if the device
    # exists; guard by leaving SHIM_ATTESTATION_MODE=software there.
    devices:
      - "/dev/sev-guest:/dev/sev-guest"
    user: root
    volumes:
      - shim-data:/data
    depends_on:
      - ollama
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SHIM_DOMAIN: ${SHIM_DOMAIN:?set SHIM_DOMAIN in .env, e.g. 34-10-20-30.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - shim
    restart: unless-stopped

volumes:
  ollama-models:
  shim-data:
  caddy-data:
  caddy-config:
